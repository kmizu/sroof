name: Release

# Publishes to Maven Central when a version tag is pushed.
#
# This workflow is inert until the four secrets below exist: the guard job checks
# for them and skips the release rather than failing, so a fork or an
# unconfigured repository sees a green skip instead of a red error.
#
# Setup instructions: docs/publishing.md
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Verify before publishing.  A release is not the place to discover a failure,
  # and unlike a normal push it cannot be undone by fixing forward.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run the full test suite
        run: sbt clean test

      - name: Check the .sroof examples end-to-end
        run: |
          sbt "cli/run check examples/nat.sroof" \
              "cli/run check examples/int.sroof" \
              "cli/run check stdlib/PolyList.sroof"

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: Check that publishing is configured
        id: configured
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
        run: |
          if [ -n "$SONATYPE_USERNAME" ] && [ -n "$PGP_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing secrets are not set; skipping. See docs/publishing.md."
          fi

      - uses: actions/setup-java@v4
        if: steps.configured.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1
        if: steps.configured.outputs.ready == 'true'

      - name: Import the signing key
        if: steps.configured.outputs.ready == 'true'
        run: echo "${{ secrets.PGP_SECRET }}" | base64 --decode | gpg --batch --import

      - name: Publish signed artifacts and release the bundle
        if: steps.configured.outputs.ready == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
        run: sbt ci-release-sroof

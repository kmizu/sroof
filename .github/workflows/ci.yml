name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Dedicated kernel soundness gate ----
  kernel-soundness:
    name: Kernel soundness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run trusted-kernel soundness tests
        run: sbt kernel/test

  # ---- JVM: compile + test ----
  test:
    name: Test (JVM, Scala 3.3.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run tests
        run: sbt test

      - name: Check nat.sroof end-to-end
        run: sbt "cli/run check examples/nat.sroof"

      - name: Check int.sroof end-to-end
        run: sbt "cli/run check examples/int.sroof"

      - name: Check Effect runtime extraction
        run: ./scripts/check_effect_runtime.sh

  # ---- Scala 3 frontend: compiler-plugin verification ----
  scala-frontend:
    name: Scala 3 frontend (compiler plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      # Translation and proof-runner tests, with no compiler in the loop: a
      # failure here points at the Scala-to-core bridge rather than extraction.
      - name: Frontend translation and proof tests
        run: sbt scalaFrontend/test

      # The real end-to-end gate: this compiles ordinary .scala with the plugin
      # enabled, so a theorem that stops holding fails the build.
      - name: Verify the Scala 3 example with the plugin enabled
        run: sbt scalaExamples/compile

      - name: Verified module still runs as an ordinary program
        run: sbt scalaExamples/test

      # Positive, negative, and symbol-identity tests driving genuine dotc runs.
      - name: Compiler-plugin integration tests
        run: sbt scalaIt/test

  # ---- Benchmarks: median + threshold gate ----
  benchmarks:
    name: Benchmarks (median thresholds)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Run benchmark suite (3 runs, median)
        run: python3 scripts/benchmark.py --runs 3 --thresholds benchmarks/thresholds.json --output benchmarks/results.json --fail-on-breach

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results.json
          if-no-files-found: error

  # ---- Scala Native: compile + link ----
  native:
    name: Native binary (Scala Native 0.5.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Install LLVM / clang
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang lld libunwind-dev

      - name: Compile and test native modules
        # The native modules share the JVM modules' sources, so this is the same code
        # — but not the same runtime. CI compiled it and never ran a test against it,
        # which left `nativeRoot/test` (documented in CLAUDE.md) unverified and any
        # javalib gap in a *test* source invisible until someone ran it by hand.
        run: sbt cliNative/compile cliNative/test

      - name: Link native binary
        run: sbt cliNative/nativeLink

      - name: Smoke-test native binary
        # Deliberately still only `check`. Everything the *logic* does is covered by
        # `cliNative/test` above, which runs the whole cli suite against the native
        # runtime. What a smoke test would add on top is the real binary's process
        # behaviour — stdin at end of input, exit codes — and that could not be
        # verified while writing this (linking needs several GB of scratch space).
        # An unverified CI step that can hang the build is worse than the gap.
        run: |
          BINARY=$(find cli-native/target -name "sroof-cli-native" -type f | head -1)
          echo "Binary: $BINARY ($(du -sh $BINARY | cut -f1))"
          $BINARY check examples/nat.sroof
          $BINARY check examples/int.sroof

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: sroof-cli-linux-amd64
          path: cli-native/target/scala-3.3.6/sroof-cli-native
          if-no-files-found: error

  # ---- sbt plugin: compile ----
  sbt-plugin:
    name: sbt plugin (Scala 2.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Compile sbt-sroof plugin
        run: cd sbt-sroof && sbt compile
